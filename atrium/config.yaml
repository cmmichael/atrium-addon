name: Atrium
version: "0.9.16"
slug: atrium
description: Your house in the Atrium app and on the web, from anywhere, over your tailnet
url: https://github.com/cmmichael/atrium-addon
image: ghcr.io/cmmichael/atrium-{arch}  # built by the add-on repository's workflow on each release; pulled, not built, on install
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
homeassistant_api: true
hassio_api: true       # GET /addons/<slug>/info, to confirm a listed writer's address with the Supervisor (default role; nothing more is asked)
map:
  - type: addon_config   # the add-on's own folder (/addon_configs/<slug> on the host, /config here): atrium.yaml, the declared layout
    read_only: false     # PUT /atrium/mapping writes it
ingress: true
ports:
  8126/tcp: 8126
ports_description:
  8126/tcp: For the app at home or over a VPN without Tailscale (asks for a Home Assistant sign-in). Clear it to turn this off.
ingress_port: 8099
watchdog: tcp://[HOST]:[PORT:8099]   # the Supervisor restarts the add-on if its ingress port stops answering
panel_icon: mdi:home-heart
panel_title: Atrium
options:
  hostname: atrium
  allow: []
  people: []
  admins: []
  writers: []   # add-on slugs allowed to write the layout, e.g. the Claude Code app (a slug is <repository-hash>_<name>, such as d7e97e69_claudecode)
  apns_team_id: ""   # alerts to the phones: your Apple developer team id, the APNs key's id and the key itself (the .p8 file's contents); see DOCS
  apns_key_id: ""
  apns_key: ""
schema:
  hostname: str
  auth_key: password?
  allow:
    - str
  people:
    - login: str
      token: password?
  admins:
    - str
  writers:
    - str
  apns_team_id: str?
  apns_key_id: str?
  apns_key: password?
  apns_bundle: str?
