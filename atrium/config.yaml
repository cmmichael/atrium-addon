name: Atrium
version: "0.8.2"
slug: atrium
description: Your house in the Atrium app and on the web, from anywhere, over your tailnet
url: https://github.com/cmmichael/atrium-addon
image: ghcr.io/cmmichael/atrium-{arch}  # built by the add-on repository's workflow on each release; pulled, not built, on install
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
homeassistant_api: true
map:
  - type: addon_config   # the add-on's own folder (/addon_configs/<slug> on the host, /config here): atrium.yaml, the declared layout
    read_only: false     # PUT /atrium/mapping writes it
ingress: true
ports:
  8126/tcp: 8126
ports_description:
  8126/tcp: For the app at home or over a VPN without Tailscale (asks for a Home Assistant sign-in). Clear it to turn this off.
ingress_port: 8099
panel_icon: mdi:home-heart
panel_title: Atrium
options:
  hostname: atrium
  allow: []
  people: []
  admins: []
  writers: []   # add-on slugs allowed to write the layout, e.g. the Claude Code app (d7e97e69_claudecode)
schema:
  hostname: str
  auth_key: password?
  allow:
    - str
  people:
    - login: str
      token: password?
  admins:
    - str
  writers:
    - str
