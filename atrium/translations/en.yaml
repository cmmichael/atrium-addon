# What Home Assistant shows on Atrium's Configuration tab.
configuration:
  hostname:
    name: Name on your tailnet
    description: The machine name Atrium takes on Tailscale. The app looks for "atrium"; with another name, enter the address once.
  auth_key:
    name: Tailscale auth key
    description: Optional. Signs Atrium in without the button on its page. A key that applies a tag leaves Atrium without an owner, so list who may use it.
  allow:
    name: Who may use Atrium
    description: Tailscale logins (e-mail addresses). Whoever signed Atrium in is always allowed.
  people:
    name: People with a Home Assistant user of their own
    description: A login and a long-lived access token from that person's Home Assistant profile, so what they do is done as them.
  writers:
    name: Apps that may write the layout
    description: Home Assistant apps (by slug) allowed to write atrium.yaml from inside Home Assistant. The Claude Code app is listed so it can run the atrium-mapping skill; add others here.
  admins:
    name: Who may change the layout
    description: Logins that may edit the layout for everyone. Whoever signed Atrium in always may.
