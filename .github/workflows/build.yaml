# Builds the add-on's images for both architectures and pushes them to ghcr.io, so Home Assistant pulls a
# ready image instead of compiling on the house's machine. tools/publish-addon.sh puts this file at
# .github/workflows/build.yaml in the public add-on repository; it runs on every v<version> tag pushed there.
name: Build images
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "version=$(grep '^version:' atrium/config.yaml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: atrium
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.v.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/atrium-${{ matrix.arch }}:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/atrium-${{ matrix.arch }}:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
